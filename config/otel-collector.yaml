# OpenTelemetry Collector Contrib configuration — Project DAEDALUS
# Phase 1 infrastructure configuration (P1-OBJ-001).
# Pipeline: OTLP receivers → batch processor → Prometheus exporter + logging exporter
# Health check extension exposed on port 13133 (required for Docker Compose health check).

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889

  # Verbosity: normal — sufficient for dev visibility without flooding stdout with raw payloads.
  # Change to "detailed" for deeper pipeline debugging; change to "basic" to reduce noise.
  logging:
    verbosity: normal

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, logging]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging]
