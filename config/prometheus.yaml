# Prometheus scrape configuration — Project DAEDALUS
# Phase 1 infrastructure configuration (P1-OBJ-001).
# Scrapes metrics from the OTel Collector Prometheus exporter endpoint.
# The otel-collector service name resolves via the daedalus-net Docker Compose network.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8889
