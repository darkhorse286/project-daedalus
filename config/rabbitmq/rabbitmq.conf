# RabbitMQ configuration — Project DAEDALUS
# Phase 1 infrastructure configuration (P1-OBJ-001).
# Loads queue topology definitions at startup to satisfy ADR-003 without application-side
# initialization code. The definitions file declares routing-jobs and routing-jobs-dead-letter.
#
# SIDE EFFECT: RabbitMQ 3.13 skips RABBITMQ_DEFAULT_USER/PASS default-user seeding when
# management.load_definitions is configured. The daedalus user must therefore be defined in
# definitions.json with a SHA-256 password hash. See config/rabbitmq/definitions.json and
# .env.example for the credential management instructions.

management.load_definitions = /etc/rabbitmq/definitions.json
